<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ebitengine製のUFOシューティングゲーム">
    <title>UFO撃ち落としたことありますか？</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b14;
        color: #f5f7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #202b50 0, #080b14 58%);
      }

      main {
        width: 100%;
        padding: clamp(0.5rem, 2vw, 1.25rem);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.35rem, 4vw, 2rem);
      }

      .game-frame {
        width: min(96vw, 960px, calc((100dvh - 8rem) * 4 / 3));
        aspect-ratio: 4 / 3;
        margin: clamp(0.5rem, 1.5vh, 1rem) auto;
        overflow: hidden;
        background: #000;
        border: 1px solid #59678f;
        border-radius: 0.75rem;
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 45%);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .controls {
        margin: 0;
        color: #cbd5f5;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UFO撃ち落としたことありますか？</h1>
      <div class="game-frame">
        <iframe id="game" title="UFOシューティングゲーム" allow="autoplay" scrolling="no"></iframe>
      </div>
      <p class="controls">← →: 移動 / Space: 発射・スタート / ↑: 必殺技 / Esc: リスタート</p>
    </main>
    <script>
      const gameFrame = document.querySelector("#game");
      const debug = new URLSearchParams(window.location.search).get("debug") === "1";
      gameFrame.src = debug ? "game.html?debug=1" : "game.html";
    </script>
  </body>
</html>
